version: '3'
services:
  lab:
    image: jldev_poetryjl
    container_name: jldev_poetryjl-lab
    volumes:
      - ./:/workspace/jldev_poetry
    working_dir: /workspace/jldev_poetry
    ports:
      - "8888:8888"
    command: poetry run jupyter lab --ServerApp.root_dir=/workspace/jldev_poetry --ip=0.0.0.0 --allow-root
  shell:
    image: jldev_poetryjl
    container_name: jldev_poetryjl-shell
    volumes:
      - ./:/workspace/jldev_poetry
    working_dir: /workspace/jldev_poetry
    command: /bin/bash
  web:
    image: jldev_poetryjl
    container_name: jldev_poetryjl-packagedocs
    volumes:
      - ./:/workspace/jldev_poetry
    working_dir: /workspace/jldev_poetry
    ports:
      - "8000:8000"
    command: poetry run make web
  pluto:
    image: jldev_poetryjl
    container_name: jldev_poetryjl-pluto
    volumes:
      - ./:/workspace/jldev_poetry
    working_dir: /workspace/jldev_poetry
    ports:
      - "1234:1234"
    command: poetry run julia -e 'import Pluto; Pluto.run(host="0.0.0.0", port=1234)'
